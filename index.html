<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <h1>Wheather Dashboard</h1>

    <div id="search">
        <input type="text" id="city-input" placeholder="Cerca una città..." />
        <button id="search-btn">Cerca</button>
    </div>

    <div id="meteo">
        <p id="city-name"></p>
        <img id="weather-icon" src="" alt="" />
        <p id="temperature"></p>
        <p id="description"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
        <p id="feels-like"></p>
    </div>

    <div id="forecast"></div>

    <p id="error-msg" style="display:none">Città non trovata. Riprova.</p>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
